name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build simple-file-browser
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: ./build.sh

      - name: Package distribution
        shell: bash
        run: |
          set -euo pipefail
          cd dist/simple-file-browser
          chmod +x simple-file-browser
          # keep the arch-named copy as a standalone asset for direct download.
          cp simple-file-browser "simple-file-browser-linux-${{ matrix.arch }}"
          tar czf "../../simple-file-browser-linux-${{ matrix.arch }}.tar.gz" \
              simple-file-browser simple-file-browser.service simple-file-browser.env install.sh
          cd ../..
          sha256sum "simple-file-browser-linux-${{ matrix.arch }}.tar.gz" \
              > "simple-file-browser-linux-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            simple-file-browser-linux-${{ matrix.arch }}.tar.gz
            simple-file-browser-linux-${{ matrix.arch }}.tar.gz.sha256
            dist/simple-file-browser/simple-file-browser-linux-${{ matrix.arch }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
